# ==============================================
# GitHub Actions CI Pipeline (Backup CI)
# ==============================================
# Runs on every push and PR to main branch
# Complements the Jenkins pipeline
# ==============================================

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKERHUB_USERNAME: adeshbusari20
  FRONTEND_IMAGE: adeshbusari20/expense-tracker-frontend
  BACKEND_IMAGE: adeshbusari20/expense-tracker-backend

jobs:
  # ---- Backend Tests ----
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run linting
        run: |
          cd backend
          flake8 app/ --max-line-length=120 --statistics || true

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  # ---- Frontend Build Validation ----
  frontend-test:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build production bundle
        working-directory: frontend
        env:
          CI: false
          DISABLE_ESLINT_PLUGIN: true
        run: npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          echo "--- Build output ---"
          ls -lh build/
          test -f build/index.html && echo "✅ index.html exists" || exit 1
          ls build/static/js/*.js > /dev/null 2>&1 && echo "✅ JS bundles exist" || exit 1
          ls build/static/css/*.css > /dev/null 2>&1 && echo "✅ CSS bundles exist" || exit 1
          echo "✅ Frontend build validation passed"

  # ---- Security Scan ----
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'

  # ---- Docker Build & Push ----
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  # ---- Kubernetes Deploy ----
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: |
          echo "🔍 Validating Kubernetes manifests..."
          MANIFESTS=(
            kubernetes/namespace.yaml
            kubernetes/configmap.yaml
            kubernetes/secrets.yaml
            kubernetes/pv.yaml
            kubernetes/pvc.yaml
            kubernetes/postgres-statefulset.yaml
            kubernetes/backend-deployment.yaml
            kubernetes/frontend-deployment.yaml
            kubernetes/ingress.yaml
            kubernetes/hpa.yaml
          )
          FAILED=0
          for manifest in "${MANIFESTS[@]}"; do
            if kubectl apply --dry-run=client -f "$manifest" > /dev/null 2>&1; then
              echo "  ✅ $manifest"
            else
              echo "  ❌ $manifest"
              kubectl apply --dry-run=client -f "$manifest" 2>&1 || true
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Manifest validation failed"
            exit 1
          fi
          echo "✅ All Kubernetes manifests are valid"

      - name: Deployment summary
        run: |
          echo "=============================================="
          echo "📦 Deployment Summary"
          echo "=============================================="
          echo "Images built and pushed:"
          echo "  🐳 adeshbusari20/expense-tracker-backend:${{ github.sha }}"
          echo "  🐳 adeshbusari20/expense-tracker-frontend:${{ github.sha }}"
          echo ""
          echo "Kubernetes manifests validated:"
          echo "  ✅ All 10 manifests passed dry-run validation"
          echo ""
          echo "To deploy to a live cluster, run:"
          echo "  kubectl apply -f kubernetes/"
          echo "=============================================="

