# ==============================================
# Ansible Inventory
# ==============================================
# Replace IP addresses with your actual EC2 public IPs
# After running: terraform output
# ==============================================

[app_servers]
app-server ansible_host=YOUR_APP_SERVER_IP

[jenkins_servers]
jenkins-server ansible_host=YOUR_JENKINS_SERVER_IP

[monitoring_servers]
monitoring-server ansible_host=YOUR_MONITORING_SERVER_IP

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/expense-tracker-key.pem
ansible_python_interpreter=/usr/bin/python3
