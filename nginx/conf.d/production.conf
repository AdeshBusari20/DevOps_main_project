# ==============================================
# NOTICE: SSL config has moved
# ==============================================
# The production HTTPS configuration is now in:
#   production.conf.ssl
#
# It is NOT a .conf file so Nginx does not
# auto-load it (which would crash without certs).
#
# To activate HTTPS, run:
#   sudo bash scripts/setup-ssl.sh
#
# That script will:
#   1. Obtain SSL certificates from Let's Encrypt
#   2. Copy production.conf.ssl -> default.conf
#   3. Restart Nginx with HTTPS enabled
# ==============================================
