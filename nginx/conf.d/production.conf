# ==============================================
# NGINX Production Configuration - HTTPS
# ==============================================
# Full production config with:
# - HTTP → HTTPS redirect
# - TLS 1.2/1.3 with modern ciphers
# - Let's Encrypt certificate paths
# - HSTS, OCSP stapling
# - Rate limiting, security headers
# - Proxy to frontend + backend
#
# Prerequisites:
#   1. Run scripts/setup-ssl.sh to obtain SSL certs
#   2. Replace YOUR_DOMAIN with your domain or IP.nip.io
#   3. Swap this file in place of default.conf for production
#
# Usage:
#   cp nginx/conf.d/production.conf nginx/conf.d/default.conf
#   docker compose -f docker-compose.prod.single.yml restart nginx
# ==============================================

# ---- HTTP → HTTPS Redirect ----
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge (must be accessible over HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS Server Block ----
server {
    listen 443 ssl http2;
    server_name _;

    # ---- SSL Certificate (Let's Encrypt) ----
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ---- SSL Security Settings ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # ---- SSL Session Settings ----
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- OCSP Stapling ----
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ---- HSTS (HTTP Strict Transport Security) ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ---- Security Headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:;" always;

    # ---- Frontend (React App) ----
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- Backend API ----
    location /api/ {
        limit_req zone=api burst=30 nodelay;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ---- Health Check ----
    location /health {
        proxy_pass http://backend_upstream/health;
        access_log off;
    }

    # ---- API Documentation ----
    location /docs {
        proxy_pass http://backend_upstream/docs;
    }

    location /redoc {
        proxy_pass http://backend_upstream/redoc;
    }

    location /openapi.json {
        proxy_pass http://backend_upstream/openapi.json;
    }

    # ---- Prometheus Metrics (restricted) ----
    location /metrics {
        proxy_pass http://backend_upstream/metrics;
        # Only allow local and private network access
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # ---- Error Pages ----
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
