# ==============================================
# NGINX Server Block - Reverse Proxy
# ==============================================
# Routes all traffic:
#   /        -> React frontend (expense-frontend:80)
#   /api/    -> FastAPI backend (expense-backend:8000)
#   /health  -> Backend health check
#   /docs    -> Swagger API docs
#
# Works with both docker-compose.yml (dev) and
# docker-compose.prod.single.yml (production).
# ==============================================

server {
    listen 80;
    server_name _;

    # ---- Backend API (MUST be before / catch-all) ----
    # All HTTP methods: GET, POST, PUT, DELETE, PATCH, OPTIONS
    location /api/ {
        proxy_pass http://expense-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Allow large request bodies (file uploads)
        client_max_body_size 10m;
    }

    # ---- Health Check ----
    location /health {
        proxy_pass http://expense-backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # ---- API Docs (Swagger) ----
    location /docs {
        proxy_pass http://expense-backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://expense-backend:8000/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://expense-backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Prometheus Metrics ----
    location /metrics {
        proxy_pass http://expense-backend:8000/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # ---- Frontend (React SPA) ----
    # Catch-all: everything not matched above goes to the frontend
    location / {
        proxy_pass http://expense-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (React hot reload in dev)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- Error Pages ----
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
