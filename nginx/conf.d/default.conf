# ==============================================
# NGINX Server Block - Reverse Proxy
# ==============================================
# Routes traffic to frontend and backend services
# ==============================================

server {
    listen 80;
    server_name _;

    # ---- Frontend (React App) ----
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for React hot reload in dev)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- Backend API ----
    location /api/ {
        limit_req zone=api burst=30 nodelay;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ---- Health Check ----
    location /health {
        proxy_pass http://backend_upstream/health;
        access_log off;
    }

    # ---- API Docs ----
    location /docs {
        proxy_pass http://backend_upstream/docs;
    }

    location /redoc {
        proxy_pass http://backend_upstream/redoc;
    }

    location /openapi.json {
        proxy_pass http://backend_upstream/openapi.json;
    }

    # ---- Metrics (restrict in production) ----
    location /metrics {
        proxy_pass http://backend_upstream/metrics;
        # In production, restrict to monitoring server IP:
        # allow 10.0.0.0/16;
        # deny all;
    }

    # ---- Static error pages ----
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

