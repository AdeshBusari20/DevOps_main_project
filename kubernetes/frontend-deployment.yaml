# Frontend Deployment + Service
# Runs React/NGINX pods
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: expense-tracker
  labels:
    app: expense-tracker
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expense-tracker
      component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: expense-tracker
        component: frontend
    spec:
      containers:
        - name: frontend
          image: adeshbusari20/expense-tracker-frontend:latest
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: expense-tracker
  labels:
    app: expense-tracker
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: expense-tracker
    component: frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
