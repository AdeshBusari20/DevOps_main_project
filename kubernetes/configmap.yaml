# ConfigMap - Non-sensitive application configuration
# Pods reference these values as environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: expense-tracker-config
  namespace: expense-tracker
  labels:
    app: expense-tracker
data:
  APP_NAME: "ai-expense-tracker"
  APP_ENV: "production"
  DEBUG: "false"
  BACKEND_PORT: "8000"
  FRONTEND_PORT: "80"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "expense_tracker"
